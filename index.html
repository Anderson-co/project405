<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSC 405 Project - Group 4</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>

body{
    margin:0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:#f39c12; /* SAME ORANGE BACKGROUND */
}

/* MAIN CONTAINER */
.container{
    width:90%;
    max-width:850px;
    margin:50px auto;
    text-align:center;
}

/* HEADINGS */
.project-title{
    font-size:18px;
    font-weight:bold;
    color:#111;
    letter-spacing:1px;
}

.group{
    font-size:38px;
    font-weight:900;
    margin:5px 0 20px;
}

/* TABLE CARD */
.card{
    background:white;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
    overflow:hidden;
}

/* TABLE HEADER */
.header-row{
    display:flex;
    justify-content:space-between;
    padding:15px 25px;
    background:#222;
    color:white;
    font-weight:bold;
    font-size:14px;
}

/* TEAM ROWS */
.team{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 25px;
    border-bottom:1px solid #eee;
    transition:0.3s;
}

.team:hover{
    background:#fdf2e9;
}

.team:last-child{
    border-bottom:none;
}

.club{
    font-weight:600;
}

/* POINT BADGE */
.points{
    background:#e67e22;
    color:white;
    padding:6px 14px;
    border-radius:30px;
    font-weight:bold;
}

/* SOCIAL SECTION */
.social{
    margin-top:30px;
}

.social h3{
    margin-bottom:10px;
}

.social button{
    border:none;
    padding:10px 18px;
    margin:5px;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.tiktok{background:black;color:white;}
.facebook{background:#1877f2;color:white;}
.twitter{background:black;color:white;}

.social button:hover{
    transform:scale(1.05);
}

/* FOOTER */
footer{
    margin-top:25px;
    font-size:12px;
}

</style>
</head>
<body>

<div class="container">

    <div class="project-title">CSC 405 PROJECT – PREMIER LEAGUE STANDINGS</div>
    <div class="group">GROUP 4</div>

    <div class="card">

        <div class="header-row">
            <div>CLUBS</div>
            <div>POINTS</div>
        </div>

        <div class="team">
            <div class="club">1. Arsenal</div>
            <div class="points">61</div>
        </div>

        <div class="team">
            <div class="club">2. Manchester City</div>
            <div class="points">58</div>
        </div>

        <div class="team">
            <div class="club">3. Aston Villa</div>
            <div class="points">51</div>
        </div>

        <div class="team">
            <div class="club">4. Manchester United</div>
            <div class="points">48</div>
        </div>

        <div class="team">
            <div class="club">5. Chelsea</div>
            <div class="points">45</div>
        </div>

        <div class="team">
            <div class="club">6. Liverpool</div>
            <div class="points">45</div>
        </div>

        <div class="team">
            <div class="club">7. Brentford</div>
            <div class="points">40</div>
        </div>

        <div class="team">
            <div class="club">8. AFC Bournemouth</div>
            <div class="points">38</div>
        </div>

        <div class="team">
            <div class="club">9. Everton</div>
            <div class="points">37</div>
        </div>

        <div class="team">
            <div class="club">10. Fulham</div>
            <div class="points">37</div>
        </div>

    </div>

    <div class="social">
        <h3>FOLLOW US</h3>
        <button class="tiktok"><i class="fab fa-tiktok"></i> TikTok</button>
        <button class="facebook"><i class="fab fa-facebook"></i> Facebook</button>
        <button class="twitter"><i class="fab fa-twitter"></i> Twitter/X</button>
    </div>

    <footer>
        © 2026 CSC 405 Project – All Rights Reserved
    </footer>

</div>

</body>
</html>
